apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi-copilot-frontend
  namespace: bi-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bi-copilot-frontend
  template:
    metadata:
      labels:
        app: bi-copilot-frontend
    spec:
      containers:
        - name: frontend
          image: bi-copilot-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: bi-copilot-frontend
  namespace: bi-copilot
spec:
  selector:
    app: bi-copilot-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
