apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bi-copilot-ingress
  namespace: bi-copilot
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [bi-copilot.example.com]
      secretName: bi-copilot-tls
  rules:
    - host: bi-copilot.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bi-copilot-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bi-copilot-frontend
                port:
                  number: 3000
