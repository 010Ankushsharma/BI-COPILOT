apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi-copilot-backend
  namespace: bi-copilot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bi-copilot-backend
  template:
    metadata:
      labels:
        app: bi-copilot-backend
    spec:
      containers:
        - name: backend
          image: bi-copilot-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: bi-copilot-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bi-copilot-backend
  namespace: bi-copilot
spec:
  selector:
    app: bi-copilot-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
